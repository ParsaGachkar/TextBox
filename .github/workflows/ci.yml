name: CI

on:
  push:
    branches: [master]
    tags: ['textbox-sdk-v*']
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/TextBox/package-lock.json

      - name: Install frontend toolchain
        run: npm ci
        working-directory: src/TextBox

      - name: Build
        run: dotnet build TextBox.slnx --nologo

      - name: Test
        run: dotnet test TextBox.slnx --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Pack SDK
        run: dotnet pack src/TextBox.Sdk/TextBox.Sdk.csproj -c Release --nologo

      - name: Upload SDK package
        uses: actions/upload-artifact@v4
        with:
          name: textbox-sdk-nupkg
          path: 'src/TextBox.Sdk/bin/Release/*.nupkg'
          if-no-files-found: error

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: xUnit Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'true'

  sdk-publish:
    runs-on: ubuntu-latest
    needs: build-test
    # Gated: only runs on textbox-sdk-v* tags (none pushed yet).
    # Publishes via NuGet trusted publishing (OIDC, no stored API key):
    # policy owner ParsaG72, repo ParsaGachkar/TextBox, workflow ci.yml.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/textbox-sdk-v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack SDK
        run: dotnet pack src/TextBox.Sdk/TextBox.Sdk.csproj -c Release --nologo

      - name: NuGet login (OIDC → temp key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ParsaG72

      - name: Push to NuGet
        run: dotnet nuget push "src/TextBox.Sdk/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    # Branches/PRs only — SDK tag pushes publish the NuGet package, not the image.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/textbox
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on master)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
